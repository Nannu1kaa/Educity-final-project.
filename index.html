<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineBox</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d12;color:white;font-family:Arial,sans-serif}
header{height:70px;background:#15151c;display:flex;align-items:center;padding:0 35px;gap:35px;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:bold;color:#e50914}
nav{display:flex;gap:22px}
nav button,.top button{background:none;border:0;color:#ddd;cursor:pointer;font-size:15px}
nav button:hover,.top button:hover{color:#e50914}
.search{margin-left:auto}
.search input{background:#22232c;border:0;border-radius:20px;padding:10px 15px;color:white;width:210px}
main{padding:30px 45px}
.hero{background:linear-gradient(90deg,#15151c,#111118);padding:45px;border-radius:15px;margin-bottom:35px}
.hero h1{font-size:42px;margin-bottom:12px}
.hero p{color:#bbb;margin-bottom:20px}
.btn{background:#e50914;color:white;border:0;padding:11px 18px;border-radius:7px;cursor:pointer}
.title{font-size:25px;margin:25px 0 18px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.card{background:#17171f;border-radius:10px;overflow:hidden}
.card img{width:100%;height:280px;object-fit:cover}
.card-info{padding:12px}
.card h3{font-size:17px;margin-bottom:7px}
.card p{font-size:13px;color:#aaa;margin-bottom:10px}
.card button{background:#24242e;color:white;border:0;padding:7px 9px;border-radius:6px;margin-right:4px;cursor:pointer}
.card button:hover{background:#e50914}
.page{display:none}
.empty{text-align:center;color:#aaa;padding:50px}
.profile{background:#17171f;padding:30px;border-radius:12px;max-width:500px}
.profile input{display:block;width:100%;padding:12px;margin:15px 0;background:#252530;border:0;color:white;border-radius:7px}
.stats{display:flex;gap:30px;margin:25px 0}
.stat{text-align:center}
.stat b{display:block;font-size:25px;color:#e50914}
.details{display:flex;gap:30px;background:#17171f;padding:25px;border-radius:12px}
.details img{width:230px;height:340px;object-fit:cover;border-radius:10px}
.details h1{margin-bottom:15px}
.details p{color:#bbb;line-height:1.6;margin-bottom:18px}
.watch{background:#050507;padding:20px;border-radius:12px;text-align:center}
.player{height:450px;background:#15151c;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:55px;color:#e50914}
footer{text-align:center;color:#777;padding:40px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>

<header>
<div class="logo">CineBox</div>

<nav>
<button onclick="home()"><i class="fa-solid fa-house"></i> Home</button>
<button onclick="moviesPage()"><i class="fa-solid fa-film"></i> Movies</button>
<button onclick="seriesPage()"><i class="fa-solid fa-tv"></i> Series</button>
<button onclick="favoritesPage()"><i class="fa-solid fa-heart"></i> Favorites</button>
<button onclick="offlinePage()"><i class="fa-solid fa-download"></i> Offline</button>
<button onclick="profilePage()"><i class="fa-solid fa-user"></i> Profile</button>
</nav>

<div class="search">
<input id="search" placeholder="Search..." onkeyup="searchMovies()">
</div>
</header>

<main>

<section id="home" class="page"></section>
<section id="movies" class="page"></section>
<section id="series" class="page"></section>
<section id="favorites" class="page"></section>
<section id="offline" class="page"></section>
<section id="profile" class="page"></section>
<section id="details" class="page"></section>
<section id="watch" class="page"></section>

</main>

<footer>
CineBox © 2026
</footer>

<script>

var movies=[
["Inception","Sci-Fi","2010","https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"],
["Interstellar","Sci-Fi","2014","https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"],
["The Dark Knight","Action","2008","https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg"],
["Avatar","Fantasy","2009","https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg"],
["Titanic","Drama","1997","https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx1dkEG6beH4tI.jpg"],
["The Matrix","Action","1999","https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg"],
["Gladiator","Action","2000","https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg"],
["Joker","Drama","2019","https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"],
["Avengers: Endgame","Action","2019","https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg"],
["Spider-Man: No Way Home","Action","2021","https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"],
["Black Panther","Action","2018","https://image.tmdb.org/t/p/w500/uxzzxijgPIY7slzFvMotPv8wjKA.jpg"],
["Iron Man","Action","2008","https://image.tmdb.org/t/p/w500/78lPtwv72eTNqFW9COBYI0dWDJa.jpg"],
["Thor","Fantasy","2011","https://image.tmdb.org/t/p/w500/prSfAi1xGrhLQNxVSUfFj3nZQ.jpg"],
["Doctor Strange","Fantasy","2016","https://image.tmdb.org/t/p/w500/uGBVj3bEbCoqZa5yZbW9r9Y5Y8L.jpg"],
["Guardians of the Galaxy","Action","2014","https://image.tmdb.org/t/p/w500/r7vmZjiyZw9rpJMQJdXpjgiCOk9.jpg"],
["Deadpool","Comedy","2016","https://image.tmdb.org/t/p/w500/fSRb7vyIP8rQpL0I47P3qUsEKX3.jpg"],
["Venom","Action","2018","https://image.tmdb.org/t/p/w500/2uNW4WbgBXL25BAbXGLnLqX71Sw.jpg"],
["It","Horror","2017","https://image.tmdb.org/t/p/w500/9E2y5Q7WlCVNEhP5g3g3xZ4tQ.jpg"],
["A Quiet Place","Horror","2018","https://image.tmdb.org/t/p/w500/nAU74GmpUk7t5iklEp3bufwDq4N.jpg"],
["The Conjuring","Horror","2013","https://image.tmdb.org/t/p/w500/wVYREutTvI2tmxr6ujrHT704wGF.jpg"],
["Home Alone","Comedy","1990","https://image.tmdb.org/t/p/w500/onTSipZ8R3bliBdKfPtsDu63oKa.jpg"],
["Harry Potter and the Sorcerer's Stone","Fantasy","2001","https://image.tmdb.org/t/p/w500/wuMc08IPKEatf9rnMNXvIDxqP4W.jpg"],
["Harry Potter and the Chamber of Secrets","Fantasy","2002","https://image.tmdb.org/t/p/w500/1sdL2CR8xN2jQ5mT7eG3G9eQ.jpg"],
["The Hunger Games","Adventure","2012","https://image.tmdb.org/t/p/w500/yXCbOiVDCxO71m3v5y5D0D3zQ.jpg"],
["Divergent","Action","2014","https://image.tmdb.org/t/p/w500/aNh4Q3iuPK8wM7bLxP0c1.jpg"],
["The Maze Runner","Action","2014","https://image.tmdb.org/t/p/w500/coss7rgv3t2QxR3L2F6.jpg"],
["Twilight","Romance","2008","https://image.tmdb.org/t/p/w500/3Gkb6jm6962ADUPaCBMhoK1b8.jpg"],
["The Fault in Our Stars","Drama","2014","https://image.tmdb.org/t/p/w500/cbN6u4J5v3Yq.jpg"],
["Me Before You","Romance","2016","https://image.tmdb.org/t/p/w500/Ia3dzj5LnC.jpg"],
["The Notebook","Romance","2004","https://image.tmdb.org/t/p/w500/rNzQyW4f8B8c.jpg"]
];

var series=[
["Stranger Things","Mystery","2016","https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg"],
["Wednesday","Mystery","2022","https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"],
["The Vampire Diaries","Drama","2009","https://image.tmdb.org/t/p/w500/kLEha9zVVv8acGFKTX4gjvPqE2.jpg"],
["The Originals","Fantasy","2013","https://image.tmdb.org/t/p/w500/qc4c0YQZ2g3z.jpg"],
["Legacies","Fantasy","2018","https://image.tmdb.org/t/p/w500/qTZIgXrBKURBK1KrsT.jpg"],
["The 100","Sci-Fi","2014","https://image.tmdb.org/t/p/w500/wcaDIAG1QdXQLRaj4vC1efK.jpg"],
["Lucifer","Fantasy","2016","https://image.tmdb.org/t/p/w500/ekZobS8isE6mA53RAi.jpg"],
["Riverdale","Drama","2017","https://image.tmdb.org/t/p/w500/sY3m2g3kQ.jpg"],
["Teen Wolf","Fantasy","2011","https://image.tmdb.org/t/p/w500/9Q6m0.jpg"],
["Pretty Little Liars","Mystery","2010","https://image.tmdb.org/t/p/w500/g7eX.jpg"],
["Cobra Kai","Action","2018","https://image.tmdb.org/t/p/w500/6POBWybSBDBKjSs1VAQcnQC1qyt.jpg"],
["You","Drama","2018","https://image.tmdb.org/t/p/w500/8gK6z.jpg"],
["Ginny & Georgia","Drama","2021","https://image.tmdb.org/t/p/w500/8W8.jpg"],
["Outer Banks","Adventure","2020","https://image.tmdb.org/t/p/w500/ovM3.jpg"],
["Wednesday","Mystery","2022","https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"]
];

var fav=JSON.parse(localStorage.getItem("favorites"))||[];
var off=JSON.parse(localStorage.getItem("offline"))||[];

function save(){
localStorage.setItem("favorites",JSON.stringify(fav));
localStorage.setItem("offline",JSON.stringify(off));
}

function hide(){
var pages=document.querySelectorAll(".page");
for(var i=0;i<pages.length;i++) pages[i].style.display="none";
}

function card(m){
return `
<div class="card">
<img src="${m[3]}" alt="${m[0]}" onerror="this.src='https://placehold.co/500x750/15151c/ffffff?text=No+Image'">
<div class="card-info">
<h3>${m[0]}</h3>
<p>${m[1]} • ${m[2]}</p>
<button onclick="details('${m[0]}')"><i class="fa-solid fa-circle-info"></i></button>
<button onclick="favorite('${m[0]}')"><i class="fa-solid fa-heart"></i></button>
<button onclick="offline('${m[0]}')"><i class="fa-solid fa-download"></i></button>
<button onclick="watch('${m[0]}')"><i class="fa-solid fa-play"></i></button>
</div>
</div>`;
}

function show(list,id,title){
hide();
var page=document.getElementById(id);
page.style.display="block";
page.innerHTML=`<h2 class="title">${title}</h2><div class="grid">${list.map(card).join("")}</div>`;
}

function home(){
hide();
var page=document.getElementById("home");
page.style.display="block";
page.innerHTML=`
<div class="hero">
<h1>Welcome to CineBox</h1>
<p>Discover movies and series in one place.</p>
<button class="btn" onclick="moviesPage()">Explore Movies</button>
</div>
<h2 class="title">Popular Movies</h2>
<div class="grid">${movies.slice(0,10).map(card).join("")}</div>
<h2 class="title">Popular Series</h2>
<div class="grid">${series.slice(0,10).map(card).join("")}</div>`;
}

function moviesPage(){
show(movies,"movies","All Movies");
}

function seriesPage(){
show(series,"series","All Series");
}

function favorite(name){
var index=fav.indexOf(name);
if(index==-1) fav.push(name);
else fav.splice(index,1);
save();
}

function offline(name){
var index=off.indexOf(name);
if(index==-1) off.push(name);
save();
alert("Added to Offline");
}

function getMovie(name){
for(var i=0;i<movies.length;i++)
if(movies[i][0]==name)return movies[i];

for(var i=0;i<series.length;i++)
if(series[i][0]==name)return series[i];
}

function details(name){
var m=getMovie(name);
hide();
var page=document.getElementById("details");
page.style.display="block";

page.innerHTML=`
<div class="details">
<img src="${m[3]}" onerror="this.src='https://placehold.co/500x750/15151c/ffffff?text=No+Image'">
<div>
<h1>${m[0]}</h1>
<p>Genre: ${m[1]}</p>
<p>Year: ${m[2]}</p>
<p>Welcome to CineBox. Here you can save this title to Favorites or Offline.</p>
<button class="btn" onclick="favorite('${m[0]}')">Add to Favorites</button>
<button class="btn" onclick="offline('${m[0]}')">Offline</button>
<button class="btn" onclick="watch('${m[0]}')">Watch</button>
</div>
</div>`;
}

function watch(name){
hide();
var page=document.getElementById("watch");
page.style.display="block";
page.innerHTML=`
<div class="watch">
<h2>${name}</h2>
<div class="player"><i class="fa-solid fa-play"></i></div>
<p style="margin-top:15px;color:#aaa">CineBox demo player</p>
</div>`;
}

function favoritesPage(){
var list=[];
for(var i=0;i<fav.length;i++){
var m=getMovie(fav[i]);
if(m)list.push(m);
}
if(list.length==0){
hide();
var p=document.getElementById("favorites");
p.style.display="block";
p.innerHTML='<div class="empty">No favorite movies yet.</div>';
}else show(list,"favorites","Favorites");
}

function offlinePage(){
var list=[];
for(var i=0;i<off.length;i++){
var m=getMovie(off[i]);
if(m)list.push(m);
}
if(list.length==0){
hide();
var p=document.getElementById("offline");
p.style.display="block";
p.innerHTML='<div class="empty">No offline titles yet.</div>';
}else show(list,"offline","Offline");
}

function searchMovies(){
var q=document.getElementById("search").value.toLowerCase();
if(q==""){
home();
return;
}

var all=movies.concat(series);
var result=all.filter(function(m){
return m[0].toLowerCase().includes(q);
});

show(result,"movies","Search Results");
}

function profilePage(){
hide();
var p=document.getElementById("profile");
p.style.display="block";

var name=localStorage.getItem("username")||"Guest";

p.innerHTML=`
<div class="profile">
<h2>Profile</h2>
<input id="username" value="${name}" placeholder="Your name">
<button class="btn" onclick="saveProfile()">Save Profile</button>

<div class="stats">
<div class="stat"><b>${fav.length}</b>Favorites</div>
<div class="stat"><b>${off.length}</b>Offline</div>
</div>
</div>`;
}

function saveProfile(){
var name=document.getElementById("username").value;
localStorage.setItem("username",name);
alert("Profile saved");
profilePage();
}

home();

</script>
</body>

    
</html>

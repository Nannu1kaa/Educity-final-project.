<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineBox</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111116;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #292930;
        }

        .logo {
            color: #e50914;
            font-size: 28px;
            font-weight: bold;
        }

        nav button {
            background: none;
            border: none;
            color: #ddd;
            margin-left: 18px;
            cursor: pointer;
            font-size: 15px;
        }

        nav button:hover {
            color: #e50914;
        }

        .search {
            width: 85%;
            max-width: 700px;
            margin: 25px auto;
        }

        .search input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #19191f;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .hero {
            min-height: 350px;
            padding: 80px 8%;
            background: linear-gradient(90deg, #111116, #19191f, #0b0b0f);
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero span {
            color: #e50914;
        }

        .hero p {
            color: #aaa;
            max-width: 600px;
            line-height: 1.6;
        }

        .hero button {
            margin-top: 25px;
            padding: 12px 22px;
            background: #e50914;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
        }

        .page {
            padding: 30px 7%;
        }

        .page h2 {
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 22px;
        }

        .card {
            background: #15151b;
            border: 1px solid #24242b;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #e50914;
        }

        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .content {
            padding: 14px;
        }

        .content h3 {
            margin-bottom: 8px;
        }

        .info {
            color: #999;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .rating {
            color: #f5c518;
            margin-bottom: 12px;
        }

        .buttons {
            display: flex;
            gap: 7px;
        }

        .buttons button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 6px;
            background: #27272f;
            color: white;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #e50914;
        }

        .fav.active {
            color: #e50914;
        }

        .details {
            max-width: 700px;
            margin: 30px auto;
            text-align: center;
        }

        .details img {
            width: 260px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .details h1 {
            margin-bottom: 15px;
        }

        .details p {
            color: #aaa;
            margin: 10px;
        }

        .back {
            background: #27272f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 60px;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            color: #777;
            border-top: 1px solid #222;
        }

        @media(max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav button {
                margin: 5px;
            }

            .hero h1 {
                font-size: 36px;
            }

        }

    </style>
</head>

<body>


<header>

    <div class="logo">
        <i class="fa-solid fa-film"></i> CineBox
    </div>

    <nav>

        <button onclick="home()">
            <i class="fa-solid fa-house"></i> Home
        </button>

        <button onclick="showMovies()">
            <i class="fa-solid fa-film"></i> Movies
        </button>

        <button onclick="showSeries()">
            <i class="fa-solid fa-tv"></i> Series
        </button>

        <button onclick="showFavorites()">
            <i class="fa-solid fa-heart"></i> Favorites
        </button>

        <button onclick="showAll()">
            <i class="fa-solid fa-layer-group"></i> All
        </button>

    </nav>

</header>


<div class="search">

    <input
        id="search"
        type="text"
        placeholder="Search movies and series..."
        onkeyup="searchMovies()">

</div>


<section id="homePage">

    <div class="hero">

        <h1>
            Welcome to <span>CineBox</span>
        </h1>

        <p>
            Discover movies and series, search for your favorites
            and explore different genres.
        </p>

        <button onclick="showAll()">
            <i class="fa-solid fa-play"></i>
            Explore
        </button>

    </div>

</section>


<section id="catalog" class="page" style="display:none;">

    <h2 id="title">
        All Movies & Series
    </h2>

    <div id="movieList" class="grid"></div>

</section>


<section id="detailsPage" class="page" style="display:none;">

    <div id="details" class="details"></div>

</section>


<footer>

    <i class="fa-solid fa-film"></i>
    CineBox

</footer>

let allContent = movies.concat(series);

let favorites = [];



function home() {

    document.getElementById("homePage").style.display = "block";
    document.getElementById("catalog").style.display = "none";
    document.getElementById("detailsPage").style.display = "none";

}



function showAll() {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "block";
    document.getElementById("detailsPage").style.display = "none";

    document.getElementById("title").innerText =
        "All Movies & Series";

    showCards(allContent);

}



function showMovies() {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "block";
    document.getElementById("detailsPage").style.display = "none";

    document.getElementById("title").innerText =
        "Movies";

    showCards(movies);

}



function showSeries() {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "block";
    document.getElementById("detailsPage").style.display = "none";

    document.getElementById("title").innerText =
        "Series";

    showCards(series);

}



function showCards(data) {

    let html = "";

    data.map(function(movie) {

        html += `

        <div class="card">

            <img src="${movie.image}">

            <div class="content">

                <h3>${movie.title}</h3>

                <p class="info">
                    ${movie.year} • ${movie.genre}
                </p>

                <p class="rating">
                    ★ ${movie.rating}
                </p>

                <div class="buttons">

                    <button onclick="showDetails(
                        '${movie.title}',
                        '${movie.year}',
                        '${movie.genre}',
                        '${movie.rating}',
                        '${movie.image}'
                    )">
                        Details
                    </button>

                    <button
                        class="fav"
                        onclick="addFavorite('${movie.title}', this)">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                </div>

            </div>

        </div>

        `;

    });

    document.getElementById("movieList").innerHTML = html;

}



function searchMovies() {

    let text =
        document.getElementById("search").value.toLowerCase();

    let result = allContent.filter(function(movie) {

        return movie.title.toLowerCase().includes(text) ||
               movie.genre.toLowerCase().includes(text);

    });

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "block";
    document.getElementById("detailsPage").style.display = "none";

    document.getElementById("title").innerText =
        "Search Results";

    showCards(result);

}




function addFavorite(title, button) {

    let found = favorites.includes(title);

    if (found) {

        favorites = favorites.filter(function(item) {
            return item !== title;
        });

        button.classList.remove("active");

    } else {

        favorites.push(title);

        button.classList.add("active");

    }

}




function showFavorites() {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "block";
    document.getElementById("detailsPage").style.display = "none";

    document.getElementById("title").innerText =
        "My Favorites";

    let result = allContent.filter(function(movie) {

        return favorites.includes(movie.title);

    });

    if (result.length == 0) {

        document.getElementById("movieList").innerHTML =
            "<div class='empty'>No favorites yet.</div>";

    } else {

        showCards(result);

    }

}




function showDetails(title, year, genre, rating, image) {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("catalog").style.display = "none";
    document.getElementById("detailsPage").style.display = "block";

    document.getElementById("details").innerHTML = `

        <button class="back" onclick="showAll()">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>

        <br>

        <img src="${image}">

        <h1>${title}</h1>

        <p>
            <b>Year:</b> ${year}
        </p>

        <p>
            <b>Genre:</b> ${genre}
        </p>

        <p>
            <b>Rating:</b> ★ ${rating}
        </p>

        <br>

        <button class="hero button"
            onclick="watchMovie('${title}')">
            <i class="fa-solid fa-play"></i>
            Watch
        </button>

    `;

}



function watchMovie(title) {

    alert(
        "CineBox player for " +
        title +
        " will be available here."
    );

}
